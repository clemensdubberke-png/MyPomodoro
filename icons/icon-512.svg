<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arcG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffbe76"/>
      <stop offset="50%"  stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff6b35" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d0d1f"/>

  <!-- Outer dashed ring -->
  <circle cx="256" cy="256" r="228" fill="none"
    stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="6 14"/>

  <!-- Tick marks -->
  <g opacity="0.25" stroke="white" stroke-linecap="round">
    <!-- 12 major ticks at every 30° -->
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate(  0 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate( 30 256 256)" stroke-width="2"/>
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate( 60 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate( 90 256 256)" stroke-width="2"/>
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate(120 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate(150 256 256)" stroke-width="2"/>
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate(180 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate(210 256 256)" stroke-width="2"/>
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate(240 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate(270 256 256)" stroke-width="2"/>
    <line x1="256" y1="30"  x2="256" y2="52"  transform="rotate(300 256 256)" stroke-width="3"/>
    <line x1="256" y1="30"  x2="256" y2="46"  transform="rotate(330 256 256)" stroke-width="2"/>
  </g>

  <!-- Track ring -->
  <circle cx="256" cy="256" r="196" fill="none"
    stroke="rgba(255,255,255,0.07)" stroke-width="18" stroke-linecap="round"/>

  <!-- Inner radial glow -->
  <circle cx="256" cy="256" r="178" fill="url(#inner)"/>

  <!-- Progress arc (~75% full) -->
  <circle cx="256" cy="256" r="196" fill="none"
    stroke="url(#arcG)" stroke-width="18" stroke-linecap="round"
    stroke-dasharray="922 1232"
    transform="rotate(-90 256 256)"
    filter="url(#glow)"/>

  <!-- Dot at arc tip -->
  <circle cx="256" cy="60" r="11" fill="#ffbe76"
    filter="url(#glow)" transform="rotate(195 256 256)"/>

  <!-- Center time display -->
  <text x="256" y="240"
    font-family="'Courier New', Courier, monospace"
    font-size="118" font-weight="700"
    fill="white" text-anchor="middle" dominant-baseline="middle"
    style="letter-spacing:-2px">25:00</text>

  <text x="256" y="310"
    font-family="Arial, Helvetica, sans-serif"
    font-size="36" font-weight="300"
    fill="rgba(255,255,255,0.42)" text-anchor="middle"
    style="letter-spacing:10px">FOKUS</text>

  <!-- 4 session dots -->
  <circle cx="220" cy="352" r="7" fill="#ff6b35" opacity="0.9"/>
  <circle cx="244" cy="352" r="7" fill="#ff6b35" opacity="0.9"/>
  <circle cx="268" cy="352" r="7" fill="rgba(255,255,255,0.15)"/>
  <circle cx="292" cy="352" r="7" fill="rgba(255,255,255,0.15)"/>
</svg>
