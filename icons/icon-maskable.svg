<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable icon: important content within center 80% (safe zone circle r=204) -->
  <defs>
    <linearGradient id="arcG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffbe76"/>
      <stop offset="50%"  stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e84118"/>
    </linearGradient>
    <radialGradient id="bgG" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="512" height="512" fill="url(#bgG)"/>

  <!-- Track ring (scaled to fit safe zone) -->
  <circle cx="256" cy="256" r="160" fill="none"
    stroke="rgba(255,255,255,0.07)" stroke-width="15"/>

  <!-- Progress arc (~75%) -->
  <circle cx="256" cy="256" r="160" fill="none"
    stroke="url(#arcG)" stroke-width="15" stroke-linecap="round"
    stroke-dasharray="754 1005"
    transform="rotate(-90 256 256)"
    filter="url(#glow)"/>

  <!-- Time text -->
  <text x="256" y="248"
    font-family="'Courier New', monospace"
    font-size="96" font-weight="700"
    fill="white" text-anchor="middle" dominant-baseline="middle">25:00</text>

  <text x="256" y="305"
    font-family="Arial, sans-serif"
    font-size="30" fill="rgba(255,255,255,0.45)"
    text-anchor="middle" style="letter-spacing:8px">FOKUS</text>
</svg>
